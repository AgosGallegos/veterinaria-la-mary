
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Veterinaria La Mary</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Estilos del proyecto -->
    <link rel="stylesheet" href="style.css?v=7">
    <link rel="stylesheet" href="paginas.css">

    <!-- Control de sesión -->
    <script src="js/auth.js" defer></script>
</head>

<body class="pagina-contacto">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Veterinaria La Mary
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="institucional.html">Institucional</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- LOGIN -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">

                            <h1 class="h3">
                                Iniciar sesión
                            </h1>

                            <p class="text-muted">
                                Acceso exclusivo para administradores.
                            </p>

                        </div>

                        <form id="formLogin">

                            <div class="mb-3">

                                <label for="usuario" class="form-label">
                                    Usuario
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="usuario"
                                    name="usuario"
                                    placeholder="Ingresá tu usuario"
                                    required
                                >

                            </div>

                            <div class="mb-3">

                                <label for="contrasenia" class="form-label">
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="contrasenia"
                                    name="contrasenia"
                                    placeholder="Ingresá tu contraseña"
                                    required
                                >

                            </div>

                            <div
                                id="mensajeLogin"
                                class="alert d-none"
                                role="alert">
                            </div>

                            <button
                                type="submit"
                                id="btnLogin"
                                class="btn btn-primary w-100">

                                Iniciar sesión

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4">
        <p class="mb-0">
            © 2026 Veterinaria La Mary. Todos los derechos reservados.
        </p>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/login.js"></script>

</body>
</html>

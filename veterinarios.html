  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="paginas.css">

  <div class="container">
    <a class="navbar-brand" href="index.html">Veterinaria La Mary</a>

      <span class="navbar-toggler-icon"></span>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">

<main class="container py-5">
  <header class="text-center mb-5">
    <h1>Gestión de Veterinarios</h1>
    <p>Registro y administración de profesionales.</p>
  </header>

  <section class="card shadow-sm mb-4">
    <div class="card-header"><h2 class="h4 mb-0" id="tituloFormulario">Nuevo veterinario</h2></div>
    <div class="card-body">
      <form id="formVeterinario">
        <input type="hidden" id="idVeterinario">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="matriculaVeterinario" class="form-label">Matrícula</label>
            <input id="matriculaVeterinario" type="number" min="1" step="1" class="form-control" required>
          </div>
          <div class="col-md-8">
            <label for="nombreVeterinario" class="form-label">Nombre completo</label>
            <input id="nombreVeterinario" class="form-control" required>
          </div>
          <div class="col-md-8">
            <label for="especializacionVeterinario" class="form-label">Especialización</label>
            <input id="especializacionVeterinario" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label for="valorConsultaVeterinario" class="form-label">Valor de consulta ($)</label>
            <input id="valorConsultaVeterinario" type="number" min="0" step="0.01" class="form-control" required>
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button id="btnGuardarVeterinario" type="submit" class="btn btn-primary">Guardar veterinario</button>
          <button id="btnCancelarEdicion" type="button" class="btn btn-secondary d-none">Cancelar</button>
        </div>
        <div id="mensajeVeterinario" class="mt-3" aria-live="polite"></div>
      </form>
    </div>
  </section>

  <section>
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <h2 class="h3">Veterinarios registrados</h2>
      <input type="search" id="filtroVeterinario" class="form-control" style="max-width:420px" placeholder="Buscar por nombre, matrícula o especialización..." aria-label="Buscar veterinario">
    </div>
    <div class="table-responsive">
      <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
          <tr><th>Nombre</th><th>Matrícula</th><th>Especialización</th><th>Valor de consulta</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaVeterinarios"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="text-center py-4"><p>Veterinaria La Mary</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<!DOCTYPE html>

  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="paginas.css">
</head>
<body class="pagina-contacto">
<nav class="navbar navbar-expand-lg navbar-light bg-white">
  <div class="container">
    <a class="navbar-brand" href="index.html">Veterinaria La Mary</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="institucional.html">Institucional</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        <li class="nav-item"><a class="nav-link active" href="mascotas.html">Mascotas</a></li>
        <li class="nav-item"><a class="nav-link" href="veterinarios.html">Veterinarios</a></li>
      </ul>
    </div>

</nav>

<main class="container py-5">
  <header class="text-center mb-5">
    <h1>Gestión de Mascotas</h1>
    <p>Registro y administración de mascotas.</p>
  </header>

  <section class="card shadow-sm mb-4">
    <div class="card-header">
      <h2 class="h4 mb-0" id="tituloFormulario">Nueva mascota</h2>
    </div>
    <div class="card-body">
      <form id="formMascota">
        <input type="hidden" id="idMascota">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="nombreMascota" class="form-label">Nombre</label>
            <input id="nombreMascota" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="nombreDuenio" class="form-label">Dueño</label>
            <input id="nombreDuenio" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label for="colorMascota" class="form-label">Color</label>
            <input id="colorMascota" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label for="edadMascota" class="form-label">Edad</label>
            <input id="edadMascota" type="number" min="0" step="1" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label for="pesoMascota" class="form-label">Peso en kg</label>
            <input id="pesoMascota" type="number" min="0.1" step="0.1" class="form-control" required>
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button id="btnGuardarMascota" class="btn btn-primary" type="submit">Guardar mascota</button>
          <button id="btnCancelarEdicion" class="btn btn-secondary d-none" type="button">Cancelar</button>
        </div>
        <div id="mensajeMascota" class="mt-3" aria-live="polite"></div>
      </form>
    </div>
  </section>

  <section>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h3">Mascotas registradas</h2>
      <span class="badge text-bg-primary fs-6">
        Total: <span id="totalMascotas">0</span>
      </span>
    </div>
    <div class="table-responsive">
      <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
          <tr><th>Nombre</th><th>Dueño</th><th>Color</th><th>Edad</th><th>Peso</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaMascotas"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="text-center py-4">
  <p>Veterinaria La Mary</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
